<!-- ==========================================
     COMPONENT: Site Controls (language toggle + download PDF)
     Outside the CV layout on purpose - excluded from the print/PDF output.
     ========================================== -->
<div class="site-controls" aria-hidden="false">

  <div class="lang-toggle">
    <span class="lang-label is-active" id="lang-label-en" aria-hidden="true">EN</span>
    <input type="checkbox" id="lang-switch" class="switch-input" role="switch" aria-checked="false"
           aria-label="Toggle site language between English and Spanish">
    <label for="lang-switch" class="switch-track">
      <span class="switch-thumb"></span>
    </label>
    <span class="lang-label" id="lang-label-es" aria-hidden="true">ES</span>
  </div>
</div>
